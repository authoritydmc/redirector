name: Docker Image CI-PROD main

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set image name
        run: echo "IMAGE_NAME=redirector" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # Fetch all history for all tags
          fetch-tags: true         # Fetch all tags from the remote repository

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set commit ID for tagging
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set version for image stamping
        run: echo "APP_VERSION=$(tr -d '[:space:]' < VERSION)" >> $GITHUB_ENV

      - name: Set major version for image tags
        run: echo "APP_MAJOR=v$(cut -d. -f1 < VERSION)" >> $GITHUB_ENV

      - name: Set up Node (SPA build for the web image)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build SPA
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push API image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:prod.${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.APP_MAJOR }}

      - name: Build and push web image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/redirector-web:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/redirector-web:prod.${{ env.COMMIT_SHA }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/redirector-web:${{ env.APP_MAJOR }}
