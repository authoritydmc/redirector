name: Docker Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build SPA (web image needs frontend/dist)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm ci
          npm run build
      - name: Prod stack smoke (local build)
        run: |
          mkdir -p /tmp/smoke-data && chmod 777 /tmp/smoke-data
          REDIRECTOR_ADMIN_PASSWORD=$(openssl rand -hex 16) REDIRECTOR_JWT_SECRET=$(openssl rand -hex 32) \
            DATA_DIR=/tmp/smoke-data docker compose -f docker/compose.prod.yml up -d --build
          for _ in $(seq 1 30); do
            curl -sf http://localhost:80/healthz && break || sleep 4
          done
          curl -sf http://localhost:80/healthz
          DATA_DIR=/tmp/smoke-data docker compose -f docker/compose.prod.yml down
      - name: Test public image (if available)
        if: always()
        run: |
          echo "Testing public image rajlabs/redirector:latest (if exists)..."
          docker pull rajlabs/redirector:latest || echo "Public image not yet available, skipping"
          if docker image inspect rajlabs/redirector:latest >/dev/null 2>&1; then
            echo "Running public image smoke test (quick health check)..."
            docker run -d --name redirector-public-test -p 18080:80 rajlabs/redirector:latest
            sleep 10
            curl -s -f http://localhost:18080/health || (docker logs redirector-public-test; exit 1)
            echo "Public image health OK"
            docker rm -f redirector-public-test
          fi
        continue-on-error: true

  docker-push-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - name: Verify images build for release tag
        run: |
          docker build -f docker/Dockerfile.api -t redirector-api:test .
          docker build -f docker/Dockerfile.web -t redirector-web:test .
          echo "Images ready for release ${{ github.ref_name }}"
