name: Release on Tag

permissions:
  contents: write
  packages: write
  actions: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Only create release if tag was pushed (e.g., via scripts/create-release-tag.ps1)
    # Use base version without build suffix for tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get version from VERSION file
        id: get_version
        run: |
          # Use base version (e.g., 3.1.0) for tag, not build suffix
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION | tr -d '[:space:]')
          else
            VERSION=$(python -c "import sys; sys.path.insert(0, '.'); import get_version; print(get_version.base_version())")
          fi
          # Fallback to git tag if VERSION missing
          if [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "3.1.0")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          body: |
            Automated release for ${{ steps.get_version.outputs.tag }}.
            See CHANGELOG.md for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
