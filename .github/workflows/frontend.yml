# v3 React SPA gates (EPIC-02/07): typecheck + unit tests + production build
# + Playwright e2e (real API on scratch DB + vite dev, self-orchestrated).
# The generated API client must match the committed OpenAPI snapshot, so
# backend contract drift breaks here too — regenerate via
# `npm run codegen` inside frontend/ and commit the result.
name: Frontend (v3 SPA)

permissions:
  contents: read

on:
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "frontend/**"
      - "docs/openapi.json"
      - ".github/workflows/frontend.yml"
  push:
    branches: ["main", "develop"]
    paths:
      - "frontend/**"
      - "docs/openapi.json"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit production dependencies (fail on high+)
        # --omit=dev: the only known vulns are dev-only vitest-toolchain
        # advisories whose fix is a breaking major; test runners never ship
        # in dist/, so the gate covers what users actually download.
        run: npm audit --omit=dev --audit-level=high
      - name: Generated client in sync
        run: |
          npm run codegen
          git diff --exit-code src/lib/api.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
      - name: Set up Python (e2e API)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps (e2e API)
        run: pip install -r backend/requirements.txt
        working-directory: .
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: frontend
