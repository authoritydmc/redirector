# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Validate

permissions:
  contents: read

on:
  push:
    branches: [ "main","develop" ]
  pull_request:
    branches: [ "main" ,"develop"]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        export PYTHONPATH=$(pwd)
        pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Docker smoke test (borrowed from Tax_Scripts)
        run: |
          chmod +x test_docker.sh
          ./test_docker.sh

  landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Landing page version must match VERSION file
        run: python3 scripts/sync-landing-version.py --check

  backend-smoke:
    # v3 FastAPI scaffold. Runs in its OWN process because the v2 Flask app's
    # gevent monkey-patching deadlocks Starlette's TestClient when both share
    # one pytest run (see tests/test_backend_smoke.py, EPIC-01).
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install v3 backend deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r backend/requirements.txt
          pip install ruff mypy
      - name: "Backend v3 lint + types (EPIC-01 gate: ruff + mypy strict)"
        run: |
          export PYTHONPATH=$(pwd)
          ruff check backend/
          mypy backend/
      - name: Backend v3 tests (isolated process)
        run: |
          export PYTHONPATH=$(pwd)
          # Glob keeps pace with new test_v3_* files automatically.
          pytest tests/test_v3_*.py tests/test_backend_smoke.py tests/test_import_v2.py -v
