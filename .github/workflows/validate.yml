# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Validate

permissions:
  contents: read

on:
  push:
    branches: [ "main","develop" ]
  pull_request:
    branches: [ "main" ,"develop"]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12"]

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        python -m pip install -r backend/requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        export PYTHONPATH=$(pwd)
        pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Log in to Docker Hub (authenticated pulls avoid rate limits)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build SPA (web image needs frontend/dist)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm ci
          npm run build
      - name: Prod stack smoke (api + web, scratch data)
        run: |
          mkdir -p /tmp/smoke-data && chmod 777 /tmp/smoke-data
          export REDIRECTOR_ADMIN_PASSWORD=$(openssl rand -hex 16)
          export REDIRECTOR_JWT_SECRET=$(openssl rand -hex 32)
          export DATA_DIR=/tmp/smoke-data
          docker compose -f docker/compose.prod.yml up -d --build
          for _ in $(seq 1 30); do
            curl -sf http://localhost:80/healthz && break || sleep 4
          done
          curl -sf http://localhost:80/healthz
          DATA_DIR=/tmp/smoke-data docker compose -f docker/compose.prod.yml down

  landing-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Landing page version must match VERSION file
        run: python3 scripts/sync-landing-version.py --check

  backend-smoke:
    # v3 FastAPI scaffold. Runs in its OWN job with live redis/postgres
    # services (the plain pytest job above has none, so broker-backed tests
    # skip there and run here).
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          # Trust auth: CI databases hold no real data, so no password
          # literals live in this file (secret scanners).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install v3 backend deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov -r backend/requirements.txt
          pip install ruff mypy
      - name: Dependency audit (pip-audit, fail on any known vuln)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: "Backend v3 lint + types (EPIC-01 gate: ruff + mypy strict)"
        run: |
          export PYTHONPATH=$(pwd)
          ruff check backend/
          mypy backend/
      - name: Backend v3 tests (isolated process)
        run: |
          export PYTHONPATH=$(pwd)
          # Glob keeps pace with new test_v3_* files automatically.
          # Coverage gate (EPIC-07): modules+core stay >= 80% (measured 82%).
          pytest tests/test_v3_*.py tests/test_backend_smoke.py tests/test_import_v2.py -v \
            --cov=backend/modules --cov=backend/core --cov-fail-under=80 --cov-report=term
      - name: OpenAPI snapshot in sync (EPIC-03 contract gate)
        run: |
          python scripts/export-openapi.py --check
