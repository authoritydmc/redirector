{% extends 'base.html' %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center text-center py-12 px-4">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700/60 p-8 flex flex-col items-center">
        <div class="w-20 h-20 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center mb-6 text-blue-600 dark:text-blue-400">
            <i class="fa-solid fa-compass text-4xl"></i>
        </div>
        <h1 class="text-6xl font-black text-gray-900 dark:text-white tracking-tight mb-2">404</h1>
        <h2 class="text-xl font-bold text-gray-800 dark:text-gray-200 mb-3">Page Not Found</h2>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-8 max-w-sm">
            {{ message or 'The requested page or shortcut does not exist or has been moved.' }}
        </p>
        <div class="flex flex-col sm:flex-row gap-3 w-full">
            <a href="{{ url_for('main.dashboard') }}" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-house"></i>
                <span>Back to Dashboard</span>
            </a>
            <a href="javascript:history.back()" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Go Back</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
