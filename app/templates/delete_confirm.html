{% extends "base.html" %}
{% block title %}Delete Shortcut - {{ subpath }}{% endblock %}

{% block content %}
<div class="flex items-center justify-center py-10 px-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-gray-100 dark:border-gray-700/60 p-8 w-full max-w-md">
        <div class="w-16 h-16 rounded-full bg-red-50 dark:bg-red-900/30 flex items-center justify-center mb-6 text-red-600 dark:text-red-400 mx-auto">
            <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
        </div>

        <h2 class="text-2xl font-bold text-center text-gray-900 dark:text-white mb-2">Delete Shortcut</h2>
        <p class="text-sm text-center text-gray-600 dark:text-gray-400 mb-6">
            Are you sure you want to delete <span class="font-mono font-bold text-red-600 dark:text-red-400">r/{{ subpath }}</span>? This action cannot be undone.
        </p>

        <form method="post" class="space-y-4">
            <div class="space-y-2">
                <label for="password" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase tracking-wider">Admin Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-red-500 focus:border-red-500 transition outline-none" placeholder="Enter admin password" required autofocus>
            </div>

            {% if error %}
            <div class="p-3 rounded-xl bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 text-sm flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <div class="pt-2 flex flex-col sm:flex-row gap-3">
                <button class="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-2" type="submit">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>Confirm Delete</span>
                </button>
                <a href="{{ url_for('main.dashboard') }}" class="flex-1 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold py-2.5 px-4 rounded-xl transition text-center flex items-center justify-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
