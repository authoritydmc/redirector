# RajLabs production stack: Redirector v4.0.0 (FastAPI + React SPA + arq)
# Traefik routes http://dev-redirector:80 directly to dev-redirector (Nginx web gateway).
# Redis acts as the caching and job queue broker.
name: redirector

services:
  # 1. API: FastAPI backend
  api:
    image: rajlabs/redirector:latest
    container_name: dev-redirector-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - REDIRECTOR_DATA_DIR=/app/data
      - REDIRECTOR_DATABASE_URL=sqlite+aiosqlite:////app/data/v3.db
      - REDIRECTOR_JOB_BACKEND=arq
      - REDIRECTOR_REDIS_URL=redis://dev-redirector-redis:6379/0
      - REDIRECTOR_ADMIN_PASSWORD=${REDIRECTOR_ADMIN_PASSWORD:-RajLabs_Redirector_Admin_83921#Sec!}
      - REDIRECTOR_JWT_SECRET=${REDIRECTOR_JWT_SECRET:-RajLabs_Redirector_JWT_98374921#Sec!}
      - SKIP_MIGRATIONS=1
    networks:
      - backend-network
    depends_on:
      redirector-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8123/healthz', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 2. Worker: arq background task worker
  worker:
    image: rajlabs/redirector:latest
    container_name: dev-redirector-worker
    command: ["python", "-m", "arq", "backend.workers.settings.WorkerSettings"]
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - REDIRECTOR_DATA_DIR=/app/data
      - REDIRECTOR_DATABASE_URL=sqlite+aiosqlite:////app/data/v3.db
      - REDIRECTOR_REDIS_URL=redis://dev-redirector-redis:6379/0
      - SKIP_MIGRATIONS=1
    networks:
      - backend-network
    depends_on:
      api:
        condition: service_healthy
      redirector-redis:
        condition: service_healthy
    healthcheck:
      disable: true

  # 3. Web: Nginx reverse-proxy & React SPA front-end (replaces dev-redirector)
  web:
    image: rajlabs/redirector-web:latest
    container_name: dev-redirector
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - backend-network
      - coolify
    depends_on:
      api:
        condition: service_healthy

  # 4. Redis: Cache & job queue broker
  redirector-redis:
    image: redis:8.0.1-alpine
    container_name: dev-redirector-redis
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redirector_redis_data:/data
    networks:
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  backend-network:
    name: dev-backend-network
    external: true
  coolify:
    external: true

volumes:
  redirector_redis_data:
    name: dev_redirector_redis_data
