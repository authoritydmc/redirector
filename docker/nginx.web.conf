# v3 production front door: SPA static + /api to the API service.
# Same SSE discipline as deploy/examples/nginx-v3.conf (buffering off).

upstream api_v3 {
    server api:8123;
    keepalive 32;
}

server {
    listen 80;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 256;

    # --- SSE: buffering off, long read timeout, no cache ---
    location ~ ^/api/v1/(upstreams/check/stream/.*|jobs/[0-9]+/events)$ {
        proxy_pass http://api_v3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control no-store always;
    }

    # --- API + probes ---
    location ~ ^/(api/|healthz|health|readyz|docs|openapi\.json|qr/) {
        proxy_pass http://api_v3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- SPA static (immutable hashed assets, never-cache the shell) ---
    location /app/ {
        alias /usr/share/nginx/html/app/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
    location = /app/index.html {
        alias /usr/share/nginx/html/app/index.html;
        expires -1;
        add_header Cache-Control "no-store" always;
    }

    # --- Redirect hot path + everything else → API (M3 behavior). ---
    # Regex locations above win where they match; this prefix fallback
    # catches the rest.
    location = / {
        return 302 /app/;
    }
    location / {
        proxy_pass http://api_v3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
