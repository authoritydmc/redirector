# M1 dual-serve front door (EPIC-08): one port, two backends.
# Derived from deploy/examples/nginx-v3.conf — the differences are the
# compose service names and the pre-M3 rule that `/` still serves Flask
# (legacy UI intact) while `/api/v1/*` already hits FastAPI.
# Validate: `docker run --rm -v $PWD/docker/nginx.m1.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine nginx -t`

upstream api_v3 {
    server api:8123;
    keepalive 32;
}

upstream flask_v2 {
    server flask:80;
    keepalive 32;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types application/json;
    gzip_min_length 256;

    # --- SSE: buffering off, long read timeout, no cache ---
    location ~ ^/api/v1/(upstreams/check/stream/.*|jobs/[0-9]+/events)$ {
        proxy_pass http://api_v3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control no-store always;
    }

    # --- v3 API surface (FastAPI) ---
    location ~ ^/(api/|healthz|health|readyz|docs|openapi\.json|qr/) {
        proxy_pass http://api_v3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Everything else: legacy Flask UI (pre-M3). M3 flips this to api_v3. ---
    location / {
        proxy_pass http://flask_v2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
