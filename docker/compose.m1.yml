# M1 dual-serve harness (EPIC-08 task 1): one port, two backends.
#
#   docker compose -f docker/compose.m1.yml up -d --build
#   curl localhost:8080/healthz          # FastAPI, via nginx
#   curl localhost:8080/                 # Flask legacy UI, via nginx
#   docker compose -f docker/compose.m1.yml down
#
# Data: the SAME host folder as production (./data by default, override
# with DATA_DIR) is mounted into both app containers — that is the point:
# v2 keeps serving the real install while v3 proves itself against it.
# Safety properties (do not weaken without review):
# - the v3 API uses its OWN database file (v3-m1.db) in the shared volume,
#   so it can never read or write the v2 schema;
# - v2 boots untouched (same Dockerfile + entrypoint as production).
# Populate the v3 DB from v2 any time with:
#   docker compose -f docker/compose.m1.yml exec api \
#     python -m backend.migrations.import_v2 --data-dir /app/data \
#     --database-url sqlite:///./data/v3-m1.db

name: redirector-m1

services:
  flask:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    volumes:
      - ${DATA_DIR:-../data}:/app/data
    environment:
      - REDIRECTOR_DATA_DIR=/app/data
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.v3
    ports:
      - "8123:8123"
    volumes:
      - ${DATA_DIR:-../data}:/app/data
    environment:
      - REDIRECTOR_DATA_DIR=/app/data
      - REDIRECTOR_DATABASE_URL=sqlite+aiosqlite:///./data/v3-m1.db
      - REDIRECTOR_AUTO_REDIRECT_DELAY=0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8123/healthz', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: "no"

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.m1.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      flask:
        condition: service_started
      api:
        condition: service_healthy
    restart: "no"
