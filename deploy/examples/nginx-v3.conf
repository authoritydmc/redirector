# Redirector v3 — example nginx front door (EPIC-06 task 4).
#
# Include from the http context (upstream is http-level):
#     http { ...; include /path/to/nginx-v3.conf; }
# Validate with `nginx -t` before reloading.
#
# Covers the SSE endpoints (job progress + upstream check stream) with
# buffering disabled, gzip for the JSON API, and sane timeouts. Adapt
# `server_name`, TLS, and upstreams to your install.
#
# Topology: internet -> nginx (:80/:443) -> uvicorn 127.0.0.1:8123.
# Pre-M3 (EPIC-08 M1/M2) the Flask app still serves HTML on :5000 while
# FastAPI serves /api/v1/* — see the commented legacy block below.

upstream redirector_v3 {
    server 127.0.0.1:8123;
    keepalive 32;
}

server {
    listen 80;
    server_name redirector.example.com;

    server_tokens off;
    client_max_body_size 10m;  # bulk import payloads

    # JSON API compression. text/event-stream is deliberately excluded:
    # compressing SSE frames delays their flush to the client.
    # (brotli needs nginx-plus or the google/ngx_brotli dynamic module;
    # add `brotli on; brotli_types application/json;` when available.)
    gzip on;
    gzip_proxied any;
    gzip_types application/json;
    gzip_min_length 256;

    # --- SSE: buffering off, long read timeout, no cache ---
    # Job event streams run up to ~5 min (600 polls x 0.5 s server-side cap).
    # Keep the regex in sync with backend/routers/upstreams.py (check
    # stream) and backend/routers/jobs.py (job events).
    location ~ ^/api/v1/(upstreams/check/stream/.*|jobs/[0-9]+/events)$ {
        proxy_pass http://redirector_v3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control no-store always;
    }

    # --- API, probes, docs, QR ---
    location ~ ^/(api/|healthz|health|readyz|docs|openapi\.json|qr/) {
        proxy_pass http://redirector_v3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- Redirect hot path GET /{pattern} ---
    # M3 cutover target: FastAPI serves this once the proxy flips.
    # Pre-M3 it must route to Flask instead (uncomment the legacy block
    # and point / at it) while /api/v1/* already hits uvicorn above.
    location / {
        proxy_pass http://redirector_v3;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # --- M1 dual-serve legacy (EPIC-08): Flask on :5000 ---
    # upstream redirector_flask { server 127.0.0.1:5000; keepalive 32; }
    # Point `location /` at http://redirector_flask until the M3 flip,
    # keeping the /api/ locations above on uvicorn.

    # --- Future SPA static (EPIC-02): cache aggressively, immutable assets ---
    # location /app/ {
    #     alias /srv/redirector-spa/;
    #     expires 1y;
    #     add_header Cache-Control "public, immutable" always;
    # }
    # location = /app/index.html {
    #     alias /srv/redirector-spa/index.html;
    #     expires -1;
    #     add_header Cache-Control "no-store" always;
    # }

    # TLS: terminate here (certbot --nginx or a managed cert) and add
    # `listen 443 ssl;` + cert paths; keep this :80 block as a redirect.
}
