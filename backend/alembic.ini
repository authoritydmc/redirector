# Alembic configuration for the v3 backend (EPIC-04 task 1).
#
# Separate history from the v2 Flask-Migrate `migrations/` dir on purpose:
# the v3 schema is a clean break, and v2 data arrives via `import-v2`,
# never via upgrade scripts.
#
# Run from the repo root:
#   alembic -c backend/alembic.ini upgrade head
#   alembic -c backend/alembic.ini revision --autogenerate -m "what changed"
#
# The database URL comes from REDIRECTOR_DATABASE_URL (env-first, see
# backend/core/config.py); `alembic -x url=<URL>` overrides it per-run,
# which is how tests point at scratch databases.

[alembic]
script_location = backend/alembic
# NOTE: no prepend_sys_path — env.py puts the repo root on sys.path itself.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
